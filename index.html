<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ye Tools | Command Center</title>
    
    <!-- React and Babel for browser compilation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;600;900&display=swap');
        
        :root {
            --carnelian: #b92a0f;
            --champagne: #f7e4cc;
            --rajah: #f8ad5c;
            --dark-slate: #325453;
        }

        .font-roca { font-family: 'Lora', serif; }
        .font-work { font-family: 'Work Sans', sans-serif; }
        
        .grid-bg {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .natural-paper {
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        /* Custom scrollbar for brand feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--carnelian); }
        ::-webkit-scrollbar-thumb { background: var(--rajah); border-radius: 10px; }
    </style>
</head>
<body class="bg-[#b92a0f]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TOOLS = [
            {
                id: 'audit',
                title: "Brand Cultivation Audit",
                description: "Evaluate business identity across 10 strategic touchpoints.",
                icon: "target",
                color: "#b92a0f",
                accent: "text-[#b92a0f]",
                link: "/audit", 
                status: "Active"
            },
            {
                id: 'invoice',
                title: "Invoice PDF Maker",
                description: "Generate professional, brand-aligned invoices for your clients.",
                icon: "file-text",
                color: "#f8ad5c",
                accent: "text-[#f8ad5c]",
                link: "/invoice",
                status: "Active"
            },
            {
                id: 'moodboard',
                title: "Moodboard Generator",
                description: "Curate visual directions and color palettes instantly.",
                icon: "layers",
                color: "#325453",
                accent: "text-[#325453]",
                link: "#", 
                status: "Coming Soon"
            },
            {
                id: 'messaging',
                title: "Copy & Voice Guide",
                description: "Define and document your brand's unique verbal identity.",
                icon: "pen-tool",
                color: "#b92a0f",
                accent: "text-[#b92a0f]",
                link: "#",
                status: "Coming Soon"
            }
        ];

        // Small wrapper to handle Lucide icons in React-lite
        const Icon = ({ name, size = 28, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const colors = {
                carnelian: "#b92a0f",
                champagne: "#f7e4cc",
                rajah: "#f8ad5c",
                darkSlate: "#325453",
            };

            return (
                <div className="min-h-screen relative overflow-x-hidden font-work">
                    {/* BACKGROUND EFFECTS */}
                    <div className="fixed inset-0 grid-bg opacity-40 pointer-events-none" />
                    <div className="fixed inset-0 pointer-events-none opacity-[0.12] mix-blend-overlay natural-paper" />

                    {/* NAVIGATION */}
                    <nav className="relative z-20 flex justify-between items-center px-8 py-8 md:px-12">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#b92a0f] shadow-lg">
                                <Icon name="box" size={22} />
                            </div>
                            <div>
                                <h1 className="font-roca italic text-white text-2xl leading-none">Ye Tools</h1>
                                <p className="font-work text-[8px] uppercase tracking-[0.3em] text-white/50 mt-1 font-bold">Command Center</p>
                            </div>
                        </div>
                        
                        <div className="hidden md:flex gap-8">
                            {['Dashboard', 'Analytics', 'Support'].map((item) => (
                                <button key={item} className="font-work text-[10px] uppercase font-black tracking-widest text-white/60 hover:text-white transition-colors">
                                    {item}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* MAIN CONTENT */}
                    <main className="relative z-10 max-w-6xl mx-auto px-8 py-12 md:py-20">
                        
                        <header className="mb-16 max-w-2xl">
                            <h2 className="text-6xl md:text-8xl font-roca text-white italic mb-6 leading-tight">The Workspace</h2>
                            <p className="font-work text-sm md:text-base text-white/70 leading-relaxed max-w-lg">
                                Welcome back. Access your suite of brand strategy and design tools from a single, unified interface.
                            </p>
                        </header>

                        {/* SCALABLE GRID */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {TOOLS.map((tool) => (
                                <a 
                                    key={tool.id}
                                    href={tool.status === 'Active' ? tool.link : '#'}
                                    className={`group relative bg-[#f7e4cc] p-8 md:p-12 rounded-[48px] text-left transition-all duration-500 flex flex-col h-full shadow-2xl overflow-hidden
                                        ${tool.status === 'Coming Soon' ? 'opacity-60 grayscale cursor-default' : 'hover:scale-[1.02] hover:-translate-y-1'}
                                    `}
                                >
                                    {/* Tool Icon & Status */}
                                    <div className="flex justify-between items-start mb-10">
                                        <div 
                                            className="w-16 h-16 rounded-2xl flex items-center justify-center text-white shadow-xl transition-transform duration-500 group-hover:rotate-12 group-hover:scale-110"
                                            style={{ backgroundColor: tool.color }}
                                        >
                                            <Icon name={tool.icon} size={28} />
                                        </div>
                                        <span className={`font-work text-[9px] font-black uppercase tracking-widest px-4 py-2 rounded-full border-2 border-black/5 ${tool.accent}`}>
                                            {tool.status}
                                        </span>
                                    </div>

                                    {/* Tool Identity */}
                                    <div className="flex-grow">
                                        <h3 className="font-roca text-3xl md:text-4xl italic mb-4 text-[#325453]">{tool.title}</h3>
                                        <p className="font-work text-sm md:text-base text-[#325453]/60 mb-8 max-w-xs leading-relaxed">
                                            {tool.description}
                                        </p>
                                    </div>

                                    {/* Action Button */}
                                    <div className={`mt-auto flex items-center gap-3 text-[11px] font-black uppercase tracking-[0.2em] transition-all duration-300 ${tool.accent}`}>
                                        {tool.status === 'Active' ? (
                                            <React.Fragment>Open Tool <Icon name="arrow-right" size={16} className="group-hover:translate-x-2 transition-transform" /></React.Fragment>
                                        ) : (
                                            <React.Fragment>Under Construction</React.Fragment>
                                        )}
                                    </div>

                                    {/* Subtle background decoration */}
                                    <div className="absolute top-0 right-0 p-8 opacity-5 group-hover:opacity-10 transition-opacity">
                                        <Icon name="external-link" size={120} />
                                    </div>
                                </a>
                            ))}
                        </div>

                        {/* SYSTEM STATS */}
                        <section className="mt-20 pt-12 border-t border-white/10 grid grid-cols-2 md:grid-cols-4 gap-8">
                            {[
                                { label: "Active Tools", val: "02" },
                                { label: "Drafts Created", val: "14" },
                                { label: "Last Session", val: "2m ago" },
                                { label: "Hub Version", val: "v2.0" }
                            ].map((stat, i) => (
                                <div key={i}>
                                    <p className="font-work text-[9px] uppercase tracking-widest text-white/40 mb-1">{stat.label}</p>
                                    <p className="font-roca text-2xl text-white italic">{stat.val}</p>
                                </div>
                            ))}
                        </section>
                    </main>

                    <footer className="w-full text-center py-12 px-8 border-t border-white/5 mt-12 bg-black/10">
                        <p className="text-[10px] text-white/20 uppercase tracking-[1em] font-work font-black">
                            Modernista Creative • Proprietary Ecosystem
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
